; PlatformIO Project Configuration File
; AI Smart Glasses — Wokwi Simulation
;
; Build: pio run
; Upload to Wokwi: Use Wokwi VS Code extension (Ctrl+Shift+P → "Wokwi: Start Simulator")

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    bblanchon/ArduinoJson@^7.0.0

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM
